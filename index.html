<style>
:root{
  --bg:#070a12; --ink:#f2f5fb; --muted:rgba(242,245,251,.6); --line:rgba(242,245,251,.14);
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"DM Sans","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.6;min-height:100vh;overflow-x:hidden;position:relative}

/* Subtle festive glow behind countdown only (keeps logo background pure #070a12) */
body::before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 50% 62%, rgba(230,57,70,.08) 0%, rgba(15,23,42,.25) 35%, transparent 70%);pointer-events:none;z-index:0}

/* Falling Snow Canvas */
#snow{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}

/* Top Christmas Fairy Lights */
.lights{position:fixed;top:-4px;left:0;width:100%;display:flex;justify-content:space-around;pointer-events:none;z-index:4;padding:0 12px;border-top:1px solid rgba(242,245,251,.14)}
.bulb{position:relative;width:9px;height:13px;border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;margin-top:5px;animation:twinkle 2.4s infinite ease-in-out alternate}
.bulb::before{content:"";position:absolute;top:-5px;left:2.5px;width:4px;height:5px;background:#2b3245;border-radius:1px}
.bulb:nth-child(4n+1){background:#ffd166;box-shadow:0 0 12px 2px rgba(255,209,102,.7);animation-delay:0s}
.bulb:nth-child(4n+2){background:#ff4d6d;box-shadow:0 0 12px 2px rgba(255,77,109,.7);animation-delay:.6s}
.bulb:nth-child(4n+3){background:#06d6a0;box-shadow:0 0 12px 2px rgba(6,214,160,.65);animation-delay:1.2s}
.bulb:nth-child(4n+4){background:#72efdd;box-shadow:0 0 12px 2px rgba(114,239,221,.65);animation-delay:1.8s}
@keyframes twinkle{
  0%{opacity:.4;transform:scale(.92)}
  100%{opacity:1;transform:scale(1.06)}
}

/* Hanging Geddi (Ornaments / Baubles) */
.ornaments{position:fixed;top:0;left:0;width:100%;pointer-events:none;z-index:3}
.ornament{position:absolute;top:0;display:flex;flex-direction:column;align-items:center;transform-origin:top center;animation:swing 4.5s ease-in-out infinite alternate}
.ornament.o1{left:6%;animation-duration:4.8s}
.ornament.o2{left:13%;animation-duration:3.9s;animation-delay:-1.2s}
.ornament.o3{right:13%;animation-duration:4.2s;animation-delay:-2s}
.ornament.o4{right:6%;animation-duration:5s;animation-delay:-.6s}
.string{width:1.5px;background:linear-gradient(to bottom, rgba(242,245,251,.25), rgba(255,209,102,.6))}
@keyframes swing{
  0%{transform:rotate(-4deg)}
  100%{transform:rotate(4deg)}
}

/* Flying Santa Claus & Sleigh */
.santa-fly{position:fixed;top:12%;left:-280px;width:230px;pointer-events:none;z-index:1;opacity:.85;animation:flyAcross 24s linear infinite;animation-delay:1s;filter:drop-shadow(0 6px 14px rgba(255,209,102,.2))}
@keyframes flyAcross{
  0%{transform:translate3d(0, 12px, 0) rotate(-3deg)}
  25%{transform:translate3d(32vw, -16px, 0) rotate(2deg)}
  50%{transform:translate3d(65vw, 8px, 0) rotate(-2deg)}
  75%{transform:translate3d(98vw, -14px, 0) rotate(2deg)}
  100%{transform:translate3d(calc(100vw + 320px), 6px, 0) rotate(-2deg)}
}

.wrap{position:relative;z-index:2;max-width:900px;margin:0 auto;padding:44px 24px 32px;min-height:100vh;display:flex;flex-direction:column;align-items:center;text-align:center}

/* Logo without rectangle + Santa Hat right on the 'M' */
.logo-wrap{position:relative;display:inline-block;margin-bottom:14px}
.logo{display:block;width:clamp(116px,13vw,154px);height:auto;mix-blend-mode:lighten}
.santa-hat{position:absolute;top:-3%;left:10.5%;width:24%;height:auto;transform:rotate(-15deg);pointer-events:none;filter:drop-shadow(0 3px 6px rgba(0,0,0,.6));z-index:2}

main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%}
.rise{opacity:0;transform:translateY(16px);animation:rise .8s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes rise{to{opacity:1;transform:none}}
.chip{display:inline-flex;align-items:center;gap:10px;font-size:.9rem;color:var(--muted);padding:7px 16px;border-radius:999px;border:1px solid var(--line);background:rgba(242,245,251,.03);margin-bottom:24px}
.dot{width:8px;height:8px;border-radius:50%;background:#ff4d6d;box-shadow:0 0 0 0 rgba(255,77,109,.6);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 9px rgba(255,77,109,0)}100%{box-shadow:0 0 0 0 rgba(255,77,109,0)}}
h1{font-family:var(--display);font-weight:800;font-size:clamp(2.5rem,6.8vw,4.8rem);line-height:1.06;letter-spacing:-.015em;font-variant-ligatures:none}
h1 span{display:block;color:var(--muted)}

/* Countdown with Frosted Snow Rim */
.clock{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:38px;width:100%;max-width:560px}
.unit{position:relative;padding:20px 8px 14px;border-radius:18px;background:rgba(242,245,251,.04);border:1px solid var(--line);backdrop-filter:blur(4px)}
.unit::before{content:"";position:absolute;top:-1px;left:12%;right:12%;height:3px;border-radius:999px;background:linear-gradient(90deg,transparent,rgba(242,245,251,.85),transparent);box-shadow:0 2px 10px rgba(242,245,251,.35)}
.unit b{display:block;font-family:var(--display);font-weight:600;font-size:clamp(2.2rem,6vw,3.6rem);line-height:1;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.unit span{display:block;margin-top:8px;color:var(--muted);font-size:.85rem}
.when{margin-top:20px;color:var(--muted);font-size:1rem}

/* X-mas Gifts Cluster */
.gifts{margin-top:24px;margin-bottom:10px;cursor:pointer;transition:transform .25s cubic-bezier(.2,.8,.2,1);display:inline-flex;align-items:flex-end;justify-content:center}
.gifts:hover{transform:translateY(-4px) scale(1.04)}
.gifts:active{transform:scale(.97)}

.live{display:none}
.live p{font-family:var(--display);font-size:1.8rem;font-weight:600;margin-bottom:18px}
.btn{display:inline-block;padding:13px 26px;border-radius:12px;font-weight:500;color:var(--bg);text-decoration:none;background:var(--ink)}
body.launched .clock,body.launched .when,body.launched .chip,body.launched h1{display:none}
body.launched .live{display:block}
footer{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 28px;color:var(--muted);font-size:.95rem;padding-top:8px}
footer a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line);transition:border-color .2s}
footer a:hover{border-color:var(--ink)}
a:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:4px}

@media (max-width:640px){
  .clock{gap:8px}
  .unit{padding:14px 4px 10px}
  .ornament.o2,.ornament.o3{display:none}
  .ornament.o1{left:4%}
  .ornament.o4{right:4%}
  .bulb:nth-child(even){display:none}
  .santa-fly{width:170px;top:15%}
}
@media (prefers-reduced-motion:reduce){
  .dot,.bulb,.ornament,.santa-fly{animation:none}
  .santa-fly{display:none}
  .rise{animation:none;opacity:1;transform:none}
}
</style>

<script>
(function(){
  var LAUNCH = new Date('2027-01-01T00:00:00+05:30').getTime(); // Sri Lanka time
  var LIVE_URL = ''; // set to the new site path after launch; '' = reload this page
  var $ = function(id){return document.getElementById(id)};
  var pad = function(n){return String(n).padStart(2,'0')};
  var launched = false;

  /* countdown */
  function launch(){
    if(launched) return; launched = true;
    document.body.classList.add('launched');
    document.title = 'Maneesha Sathsara | AI Engineer Portfolio';
    if(LIVE_URL){ $('enter').href = LIVE_URL; location.replace(LIVE_URL); }
    else { $('enter').href = location.pathname; $('enter').textContent = 'Reload the site'; }
  }
  function tick(){
    var left = LAUNCH - Date.now();
    if(left<=0){ launch(); return; }
    var s = Math.floor(left/1000);
    $('d').textContent = pad(Math.floor(s/86400)); $('h').textContent = pad(Math.floor(s%86400/3600));
    $('m').textContent = pad(Math.floor(s%3600/60)); $('s').textContent = pad(s%60);
  }
  tick(); setInterval(tick, 1000);

  /* falling snow + interactive sparkle burst on gift click */
  var canvas = $('snow');
  var ctx = canvas.getContext('2d');
  var flakes = [];
  var sparks = [];
  var w, h;
  var reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function resize(){
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  var count = Math.min(95, Math.floor(w / 14));
  for(var i = 0; i < count; i++){
    flakes.push({
      x: Math.random() * w,
      y: Math.random() * h,
      r: Math.random() * 2.6 + 1.1,
      speed: Math.random() * 0.9 + 0.35,
      drift: Math.random() * Math.PI * 2,
      opacity: Math.random() * 0.55 + 0.25
    });
  }

  var giftBox = $('giftBox');
  if(giftBox){
    giftBox.addEventListener('click', function(e){
      var rect = giftBox.getBoundingClientRect();
      var cx = rect.left + rect.width / 2;
      var cy = rect.top + rect.height / 2;
      var colors = ['#ffd166', '#ff4d6d', '#06d6a0', '#ffffff'];
      for(var j = 0; j < 28; j++){
        var angle = Math.random() * Math.PI * 2;
        var vel = Math.random() * 4 + 1.5;
        sparks.push({
          x: cx, y: cy,
          vx: Math.cos(angle) * vel,
          vy: Math.sin(angle) * vel - 2,
          life: 1,
          color: colors[j % colors.length],
          r: Math.random() * 2.5 + 1.5
        });
      }
    });
  }

  function drawSnow(){
    ctx.clearRect(0, 0, w, h);
    for(var i = 0; i < flakes.length; i++){
      var f = flakes[i];
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(242, 245, 251, ' + f.opacity + ')';
      ctx.fill();

      if(!reducedMotion){
        f.y += f.speed;
        f.drift += 0.015;
        f.x += Math.sin(f.drift) * 0.45;
        if(f.y > h + 5){ f.y = -5; f.x = Math.random() * w; }
        if(f.x > w + 5) f.x = -5;
        if(f.x < -5) f.x = w + 5;
      }
    }

    for(var k = sparks.length - 1; k >= 0; k--){
      var sp = sparks[k];
      ctx.save();
      ctx.globalAlpha = sp.life;
      ctx.beginPath();
      ctx.arc(sp.x, sp.y, sp.r, 0, Math.PI * 2);
      ctx.fillStyle = sp.color;
      ctx.fill();
      ctx.restore();
      sp.x += sp.vx;
      sp.y += sp.vy;
      sp.vy += 0.08;
      sp.life -= 0.022;
      if(sp.life <= 0) sparks.splice(k, 1);
    }

    if(!reducedMotion) requestAnimationFrame(drawSnow);
  }
  drawSnow();
})();
</script>
</body>
