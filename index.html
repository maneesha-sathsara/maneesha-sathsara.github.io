<style>
:root{
  --bg:#070a12; --ink:#f2f5fb; --muted:rgba(242,245,251,.62); --line:rgba(242,245,251,.14);
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"DM Sans","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.6;min-height:100vh;overflow-x:hidden}

/* Subtle natural winter moonlight & horizon atmosphere */
body{
  background:
    radial-gradient(ellipse 75% 45% at 50% -8%, rgba(36, 62, 108, .32) 0%, transparent 70%),
    radial-gradient(ellipse 90% 25% at 50% 102%, rgba(200, 220, 255, .07) 0%, transparent 75%),
    #070a12;
}

/* Fullscreen Canvas for Multi-Layer Snow + Santa Stardust Trail */
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:4}

/* Blinking Top Fairy Light Garland */
.garland{position:fixed;top:0;left:0;width:100%;height:38px;pointer-events:none;z-index:2}
.g-bulb{
  transform-box:fill-box;
  transform-origin:center;
  animation:bulbBlink 1.6s infinite ease-in-out;
}
.g-bulb:nth-of-type(4n+1){animation-duration:1.45s;animation-delay:0s}
.g-bulb:nth-of-type(4n+2){animation-duration:1.85s;animation-delay:-.55s}
.g-bulb:nth-of-type(4n+3){animation-duration:1.6s;animation-delay:-1.1s}
.g-bulb:nth-of-type(4n+4){animation-duration:2.05s;animation-delay:-.35s}

@keyframes bulbBlink{
  0%, 100%{opacity:1;transform:scale(1.15);filter:brightness(1.35)}
  45%{opacity:.95;transform:scale(1.05);filter:brightness(1.15)}
  55%, 78%{opacity:.12;transform:scale(.82);filter:brightness(.35)}
  88%{opacity:1;transform:scale(1.2);filter:brightness(1.45)}
}

/* Realistic Snow-Dusted Pine Trees at Bottom Corners */
.tree-left{position:fixed;bottom:-4px;left:1vw;width:clamp(165px, 21vw, 270px);pointer-events:none;z-index:2;filter:drop-shadow(0 10px 25px rgba(0,0,0,.75))}
.tree-right{position:fixed;bottom:-4px;right:1.5vw;width:clamp(115px, 14vw, 185px);pointer-events:none;z-index:2;filter:drop-shadow(0 10px 25px rgba(0,0,0,.75))}

/* Blinking Fairy Lights on Trees */
.tree-light{
  transform-box:fill-box;
  transform-origin:center;
  animation:treeBlink 1.5s infinite ease-in-out;
}
.tree-light:nth-of-type(4n+1){animation-duration:1.35s;animation-delay:-.2s}
.tree-light:nth-of-type(4n+2){animation-duration:1.75s;animation-delay:-.7s}
.tree-light:nth-of-type(4n+3){animation-duration:1.5s;animation-delay:-1.15s}
.tree-light:nth-of-type(4n+4){animation-duration:1.9s;animation-delay:-.45s}

@keyframes treeBlink{
  0%, 100%{opacity:1;transform:scale(1.18);filter:brightness(1.4)}
  42%{opacity:.92;transform:scale(1.02)}
  54%, 76%{opacity:.1;transform:scale(.78);filter:brightness(.3)}
  88%{opacity:1;transform:scale(1.22);filter:brightness(1.5)}
}

/* Blinking & Shimmering Tree Topper Star */
.tree-star{
  transform-box:fill-box;
  transform-origin:center;
  animation:starBlink 1.8s infinite ease-in-out;
}
@keyframes starBlink{
  0%, 100%{opacity:1;transform:scale(1.18) rotate(0deg);filter:brightness(1.45)}
  45%{opacity:.9;transform:scale(1.04) rotate(4deg)}
  58%, 74%{opacity:.22;transform:scale(.82) rotate(-3deg);filter:brightness(.45)}
  86%{opacity:1;transform:scale(1.24) rotate(2deg);filter:brightness(1.6)}
}

/* Flying Santa Claus & Reindeer Sleigh */
#santaSleigh{
  position:fixed;top:0;left:0;width:205px;pointer-events:none;z-index:3;
  will-change:transform;
  filter:drop-shadow(0 8px 18px rgba(255, 214, 102, .22));
}
.leg-f{transform-origin:top center;animation:gallopF .36s infinite ease-in-out alternate}
.leg-b{transform-origin:top center;animation:gallopB .36s infinite ease-in-out alternate}
.deer-body{transform-origin:center;animation:deerStride .36s infinite ease-in-out alternate}
@keyframes gallopF{0%{transform:rotate(-26deg)}100%{transform:rotate(28deg)}}
@keyframes gallopB{0%{transform:rotate(26deg)}100%{transform:rotate(-26deg)}}
@keyframes deerStride{0%{transform:translateY(-1.2px) rotate(-2deg)}100%{transform:translateY(1.2px) rotate(2deg)}}

/* No z-index on .wrap so mix-blend-mode:screen blends directly with body & erases the black box */
.wrap{position:relative;max-width:900px;margin:0 auto;padding:44px 24px 32px;min-height:100vh;display:flex;flex-direction:column;align-items:center;text-align:center}

/* Logo with Black Box Removed + Natural Felt Santa Hat on 'M' */
.logo-wrap{position:relative;display:inline-block;margin-bottom:14px}
.logo{
  display:block;width:clamp(118px,13vw,156px);height:auto;
  mix-blend-mode:screen;
  filter:brightness(1.08) contrast(1.16);
}
.santa-hat{
  position:absolute;top:-4%;left:10%;width:24%;height:auto;
  transform:rotate(-16deg);pointer-events:none;
  filter:drop-shadow(0 3px 5px rgba(0,0,0,.75));
}

main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%}
.rise{opacity:0;transform:translateY(16px);animation:rise .8s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes rise{to{opacity:1;transform:none}}
.chip{display:inline-flex;align-items:center;gap:10px;font-size:.9rem;color:var(--muted);padding:7px 16px;border-radius:999px;border:1px solid var(--line);background:rgba(12,17,30,.55);backdrop-filter:blur(8px);margin-bottom:24px}
.dot{width:8px;height:8px;border-radius:50%;background:#ff4d6d;box-shadow:0 0 0 0 rgba(255,77,109,.6);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 9px rgba(255,77,109,0)}100%{box-shadow:0 0 0 0 rgba(255,77,109,0)}}
h1{font-family:var(--display);font-weight:800;font-size:clamp(2.5rem,6.8vw,4.8rem);line-height:1.06;letter-spacing:-.015em;font-variant-ligatures:none;text-shadow:0 8px 30px rgba(0,0,0,.6)}
h1 span{display:block;color:var(--muted)}

/* Countdown Cards with Natural Frost & Snow Accumulation */
.clock{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:40px;width:100%;max-width:560px}
.unit{
  position:relative;padding:20px 8px 14px;border-radius:18px;
  background:rgba(15, 22, 38, .55);
  border:1px solid rgba(242,245,251,.15);
  backdrop-filter:blur(10px);
  box-shadow:0 12px 32px rgba(0,0,0,.35);
}
.unit::before{
  content:"";position:absolute;top:-2px;left:10%;right:10%;height:4px;
  border-radius:999px;
  background:linear-gradient(90deg, transparent, rgba(235,244,255,.85) 25%, rgba(255,255,255,.95) 50%, rgba(235,244,255,.85) 75%, transparent);
  filter:blur(.4px);
}
.unit b{display:block;font-family:var(--display);font-weight:600;font-size:clamp(2.2rem,6vw,3.6rem);line-height:1;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.unit span{display:block;margin-top:8px;color:var(--muted);font-size:.85rem}
.when{margin-top:22px;color:var(--muted);font-size:1rem}

.live{display:none}
.live p{font-family:var(--display);font-size:1.8rem;font-weight:600;margin-bottom:18px}
.btn{display:inline-block;padding:13px 26px;border-radius:12px;font-weight:500;color:var(--bg);text-decoration:none;background:var(--ink)}
body.launched .clock,body.launched .when,body.launched .chip,body.launched h1{display:none}
body.launched .live{display:block}
footer{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 28px;color:var(--muted);font-size:.95rem;padding-top:14px}
footer a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line);transition:border-color .2s}
footer a:hover{border-color:var(--ink)}
a:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:4px}

@media (max-width:640px){
  .clock{gap:8px}
  .unit{padding:14px 4px 10px}
  .tree-left{width:125px;left:-10px;opacity:.9}
  .tree-right{width:95px;right:-10px;opacity:.85}
  #santaSleigh{width:145px}
}
@media (prefers-reduced-motion:reduce){
  .dot,.g-bulb,.tree-light,.tree-star,.leg-f,.leg-b,.deer-body{animation:none}
  #santaSleigh{display:none}
  .rise{animation:none;opacity:1;transform:none}
}
</style>
</head>

<noscript><p style="position:relative;text-align:center;padding:0 24px 24px;color:#8e9ab8">This page counts down to 1 January 2027, 12:00 am Sri Lanka time. Please enable JavaScript to see the timer.</p></noscript>

<script>
(function(){
  var LAUNCH = new Date('2027-01-01T00:00:00+05:30').getTime(); // Sri Lanka time
  var LIVE_URL = ''; // set to the new site path after launch; '' = reload this page
  var $ = function(id){return document.getElementById(id)};
  var pad = function(n){return String(n).padStart(2,'0')};
  var launched = false;

  /* Countdown Timer */
  function launch(){
    if(launched) return; launched = true;
    document.body.classList.add('launched');
    document.title = 'Maneesha Sathsara | AI Engineer Portfolio';
    if(LIVE_URL){ $('enter').href = LIVE_URL; location.replace(LIVE_URL); }
    else { $('enter').href = location.pathname; $('enter').textContent = 'Reload the site'; }
  }
  function tick(){
    var left = LAUNCH - Date.now();
    if(left<=0){ launch(); return; }
    var s = Math.floor(left/1000);
    $('d').textContent = pad(Math.floor(s/86400)); $('h').textContent = pad(Math.floor(s%86400/3600));
    $('m').textContent = pad(Math.floor(s%3600/60)); $('s').textContent = pad(s%60);
  }
  tick(); setInterval(tick, 1000);

  /* Realistic Multi-Layer Snow + Natural 360 Perimeter Santa Flight */
  var canvas = $('fx');
  var ctx = canvas.getContext('2d');
  var santaEl = $('santaSleigh');
  var flakes = [];
  var stardust = [];
  var w, h;
  var reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function resize(){
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  /* 3 Depth Layers of Snowflakes */
  var totalFlakes = Math.min(130, Math.floor(w / 10));
  for(var i = 0; i < totalFlakes; i++){
    var depth = Math.random();
    flakes.push({
      x: Math.random() * w,
      y: Math.random() * h,
      r: 0.8 + depth * 2.8,
      speedY: 0.28 + depth * 1.15,
      windAmp: 0.2 + depth * 0.65,
      phase: Math.random() * Math.PI * 2,
      freq: 0.008 + Math.random() * 0.014,
      alpha: 0.18 + depth * 0.55,
      bokeh: depth > 0.78
    });
  }

  /* Smooth, Constant-Speed Perimeter Loop Around the Whole Site */
  var theta = -0.55;
  var lastTime = performance.now();
  var frameCount = 0;

  function animate(now){
    var dt = Math.min(0.05, (now - lastTime) / 1000);
    lastTime = now;
    ctx.clearRect(0, 0, w, h);
    frameCount++;

    /* 1. Santa Sleigh Smoothly Flying All Around the Site */
    if(!reducedMotion && santaEl){
      theta += dt * ((Math.PI * 2) / 16);

      var rx = Math.max(140, w * 0.44);
      var ry = Math.max(180, h * 0.43);
      var cx = w * 0.5;
      var cy = h * 0.5;

      var px = cx + rx * (0.92 * Math.sin(theta) + 0.08 * Math.sin(3 * theta));
      var py = cy + ry * (-0.90 * Math.cos(theta) + 0.10 * Math.cos(3 * theta)) + Math.sin(now * 0.0032) * 4;

      var vx = rx * (0.92 * Math.cos(theta) + 0.24 * Math.cos(3 * theta));
      var vy = ry * (0.90 * Math.sin(theta) - 0.30 * Math.sin(3 * theta));

      var turnScaleX = vx / Math.hypot(vx, vy * 0.42);
      if(Math.abs(turnScaleX) < 0.06) turnScaleX = turnScaleX >= 0 ? 0.06 : -0.06;

      var pitchDeg = Math.atan2(vy, Math.abs(vx) + rx * 0.55) * (180 / Math.PI);

      var sw = santaEl.offsetWidth || 205;
      var sh = santaEl.offsetHeight || 65;

      santaEl.style.transform =
        'translate3d(' + (px - sw * 0.5).toFixed(1) + 'px,' + (py - sh * 0.5).toFixed(1) + 'px,0) ' +
        'scaleX(' + turnScaleX.toFixed(3) + ') ' +
        'rotate(' + pitchDeg.toFixed(1) + 'deg)';

      if(frameCount % 2 === 0){
        var tailX = px - turnScaleX * (sw * 0.34);
        var tailY = py + sh * 0.16;
        stardust.push({
          x: tailX + (Math.random() - 0.5) * 8,
          y: tailY + (Math.random() - 0.5) * 6,
          vx: -turnScaleX * 0.35 + (Math.random() - 0.5) * 0.3,
          vy: 0.2 + Math.random() * 0.4,
          r: Math.random() * 2 + 0.9,
          life: 1
        });
      }
    }

    /* 2. Render Golden Stardust Trail */
    for(var s = stardust.length - 1; s >= 0; s--){
      var pt = stardust[s];
      ctx.save();
      ctx.globalAlpha = pt.life * 0.85;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.r, 0, Math.PI * 2);
      ctx.fillStyle = pt.life > 0.5 ? '#fef08a' : '#f59e0b';
      ctx.shadowColor = '#fbbf24';
      ctx.shadowBlur = 8;
      ctx.fill();
      ctx.restore();

      pt.x += pt.vx;
      pt.y += pt.vy;
      pt.life -= 0.017;
      if(pt.life <= 0) stardust.splice(s, 1);
    }

    /* 3. Render Multi-Depth Snowfall */
    for(var i = 0; i < flakes.length; i++){
      var f = flakes[i];
      ctx.beginPath();
      if(f.bokeh){
        var grad = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r * 1.4);
        grad.addColorStop(0, 'rgba(242, 245, 251, ' + f.alpha + ')');
        grad.addColorStop(1, 'rgba(242, 245, 251, 0)');
        ctx.fillStyle = grad;
        ctx.arc(f.x, f.y, f.r * 1.4, 0, Math.PI * 2);
      } else {
        ctx.fillStyle = 'rgba(242, 245, 251, ' + f.alpha + ')';
        ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
      }
      ctx.fill();

      if(!reducedMotion){
        f.y += f.speedY;
        f.phase += f.freq;
        f.x += Math.sin(f.phase) * f.windAmp;

        if(f.y > h + 8){ f.y = -8; f.x = Math.random() * w; }
        if(f.x > w + 8) f.x = -8;
        if(f.x < -8) f.x = w + 8;
      }
    }

    if(!reducedMotion) requestAnimationFrame(animate);
  }
  requestAnimationFrame(animate);
})();
</script>
