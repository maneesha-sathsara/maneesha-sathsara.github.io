<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maneesha Sathsara | AI Engineer Portfolio, relaunching 1 January 2027</title>
<meta name="description" content="Maneesha Sathsara’s AI engineering portfolio is being rebuilt. The new site launches on 1 January 2027.">
<meta name="theme-color" content="#070a12">
<meta property="og:title" content="Maneesha Sathsara | New portfolio launching 1 January 2027">
<meta property="og:description" content="An AI engineer’s portfolio, rebuilt from scratch.">
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070a12; --ink:#f2f5fb; --muted:rgba(242,245,251,.6); --line:rgba(242,245,251,.14);
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"DM Sans","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.6;min-height:100vh;overflow-x:hidden}
.wrap{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:32px 24px 36px;min-height:100vh;display:flex;flex-direction:column;align-items:center;text-align:center}
.logo{width:42px;height:42px;border-radius:12px;background:var(--ink);display:grid;place-items:center;color:var(--bg);font-weight:800}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%}
.rise{opacity:0;transform:translateY(16px);animation:rise .8s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes rise{to{opacity:1;transform:none}}
.chip{display:inline-flex;align-items:center;gap:10px;font-size:.9rem;color:var(--muted);padding:7px 16px;border-radius:999px;border:1px solid var(--line);margin-bottom:26px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 0 rgba(242,245,251,.5);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 9px rgba(242,245,251,0)}100%{box-shadow:0 0 0 0 rgba(242,245,251,0)}}
h1{font-family:var(--display);font-weight:800;font-size:clamp(2.6rem,7vw,5rem);line-height:1.06;letter-spacing:-.015em;font-variant-ligatures:none}
h1 span{display:block;color:var(--muted)}
.clock{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:44px;width:100%;max-width:560px}
.unit{padding:20px 8px 14px;border-radius:18px;background:rgba(242,245,251,.04);border:1px solid var(--line)}
.unit b{display:block;font-family:var(--display);font-weight:600;font-size:clamp(2.2rem,6vw,3.6rem);line-height:1;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.unit span{display:block;margin-top:8px;color:var(--muted);font-size:.85rem}
.when{margin-top:22px;color:var(--muted);font-size:1rem}
.live{display:none}
.live p{font-family:var(--display);font-size:1.8rem;font-weight:600;margin-bottom:18px}
.btn{display:inline-block;padding:13px 26px;border-radius:12px;font-weight:500;color:var(--bg);text-decoration:none;background:var(--ink)}
body.launched .clock,body.launched .when,body.launched .chip,body.launched h1{display:none}
body.launched .live{display:block}
footer{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 28px;color:var(--muted);font-size:.95rem}
footer a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line);transition:border-color .2s}
footer a:hover{border-color:var(--ink)}
a:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:4px}
@media (max-width:480px){.clock{gap:8px}.unit{padding:14px 4px 10px}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}.rise{animation:none;opacity:1;transform:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo" aria-label="Maneesha Sathsara">MS</div>

  <main>
    <div class="chip rise"><i class="dot" aria-hidden="true"></i>Under maintenance</div>
    <h1 class="rise">My new portfolio <span>is coming soon.</span></h1>
    <div class="clock rise" style="animation-delay:.15s" role="timer" aria-label="Time until launch">
      <div class="unit"><b id="d">00</b><span>days</span></div>
      <div class="unit"><b id="h">00</b><span>hours</span></div>
      <div class="unit"><b id="m">00</b><span>minutes</span></div>
      <div class="unit"><b id="s">00</b><span>seconds</span></div>
    </div>
    <p class="when rise" style="animation-delay:.3s">1 January 2027, 12:00 am (Sri Lanka time)</p>
    <div class="live">
      <p>The new portfolio is live.</p>
      <a class="btn" id="enter" href="">Enter the site</a>
    </div>
  </main>

  <footer>
    <a href="mailto:maneeshasathsaram@gmail.com">maneeshasathsaram@gmail.com</a>
    <a href="https://github.com/maneesha-sathsara" rel="noopener">GitHub</a>
    <a href="Maneesha_Sathsara_CV.pdf">Download CV</a>
  </footer>
</div>
<noscript><p style="position:relative;z-index:1;text-align:center;padding:0 24px 24px;color:#8e9ab8">This page counts down to 1 January 2027, 12:00 am Sri Lanka time. Please enable JavaScript to see the timer.</p></noscript>

<script>
(function(){
  var LAUNCH = new Date('2027-01-01T00:00:00+05:30').getTime(); // Sri Lanka time
  var LIVE_URL = ''; // set to the new site path after launch; '' = reload this page
  var $ = function(id){return document.getElementById(id)};
  var pad = function(n){return String(n).padStart(2,'0')};
  var launched = false;

  /* countdown */
  function launch(){
    if(launched) return; launched = true;
    document.body.classList.add('launched');
    document.title = 'Maneesha Sathsara | AI Engineer Portfolio';
    if(LIVE_URL){ $('enter').href = LIVE_URL; location.replace(LIVE_URL); }
    else { $('enter').href = location.pathname; $('enter').textContent = 'Reload the site'; }
  }
  function tick(){
    var left = LAUNCH - Date.now();
    if(left<=0){ launch(); return; }
    var s = Math.floor(left/1000);
    $('d').textContent = pad(Math.floor(s/86400)); $('h').textContent = pad(Math.floor(s%86400/3600));
    $('m').textContent = pad(Math.floor(s%3600/60)); $('s').textContent = pad(s%60);
  }
  tick(); setInterval(tick, 1000);
})();
</script>
</body>
</html>
