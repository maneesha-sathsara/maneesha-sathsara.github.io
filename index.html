<style>
:root{
  --bg:#070a12; --ink:#f2f5fb; --muted:rgba(242,245,251,.65); --line:rgba(242,245,251,.15);
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"DM Sans","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.6;min-height:100vh;overflow-x:hidden}

/* Natural Winter Night Sky Atmosphere */
body{
  background:
    radial-gradient(ellipse 85% 50% at 50% -10%, rgba(36, 62, 110, .36) 0%, transparent 70%),
    radial-gradient(ellipse 100% 35% at 50% 100%, rgba(180, 210, 255, .12) 0%, transparent 75%),
    #070a12;
}

/* Fullscreen Canvas for Blowing Snow, Wind Mist & Ground Spindrift */
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:4}

/* Steady Lit Christmas Fairy Lights Along Top (No Blinking) */
.lights{
  position:fixed;top:-3px;left:0;width:100%;
  display:flex;justify-content:space-around;
  pointer-events:none;z-index:4;padding:0 10px;
  border-top:1px solid rgba(242,245,251,.16);
}
.bulb{
  position:relative;width:9px;height:14px;
  border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;
  margin-top:5px;
}
.bulb::before{
  content:"";position:absolute;top:-5px;left:2.5px;
  width:4px;height:5px;background:#2b3245;border-radius:1px;
}
.bulb:nth-child(4n+1){background:#ffd166;box-shadow:0 0 14px 3px rgba(255,209,102,.65)}
.bulb:nth-child(4n+2){background:#ff4d6d;box-shadow:0 0 14px 3px rgba(255,77,109,.65)}
.bulb:nth-child(4n+3){background:#06d6a0;box-shadow:0 0 14px 3px rgba(6,214,160,.6)}
.bulb:nth-child(4n+4){background:#72efdd;box-shadow:0 0 14px 3px rgba(114,239,221,.6)}

/* Snow-Covered Ground Layers (Back & Front Drifts) */
.snow-ground-back{
  position:fixed;bottom:0;left:0;width:100%;height:clamp(54px, 8vh, 88px);
  pointer-events:none;z-index:1;
}
.snow-ground-front{
  position:fixed;bottom:0;left:0;width:100%;height:clamp(36px, 5.5vh, 62px);
  pointer-events:none;z-index:3;
  filter:drop-shadow(0 -4px 14px rgba(148, 197, 255, .14));
}

/* Realistic Snow-Dusted Pine Trees Planted in the Snow (Swaying in Wind) */
.tree-left{
  position:fixed;bottom:clamp(14px, 2.5vh, 26px);left:1vw;
  width:clamp(155px, 21vw, 275px);
  pointer-events:none;z-index:2;
  transform-origin:50% 95%;
  will-change:transform;
  filter:drop-shadow(0 10px 22px rgba(0,0,0,.75));
}
.tree-right{
  position:fixed;bottom:clamp(16px, 2.8vh, 30px);right:1.5vw;
  width:clamp(112px, 14.5vw, 190px);
  pointer-events:none;z-index:2;
  transform-origin:50% 95%;
  will-change:transform;
  filter:drop-shadow(0 10px 22px rgba(0,0,0,.75));
}
.tree-upper{
  transform-box:fill-box;
  transform-origin:50% 100%;
  will-change:transform;
}

/* ONLY the Christmas Tree Star twinkles/blinks */
.tree-star{
  transform-box:fill-box;
  transform-origin:center;
  animation:starTwinkle 1.8s infinite ease-in-out;
}
@keyframes starTwinkle{
  0%, 100%{opacity:1;transform:scale(1.18) rotate(0deg);filter:brightness(1.45)}
  45%{opacity:.92;transform:scale(1.04) rotate(3deg)}
  58%, 74%{opacity:.18;transform:scale(.8) rotate(-3deg);filter:brightness(.4)}
  88%{opacity:1;transform:scale(1.24) rotate(2deg);filter:brightness(1.6)}
}

/* No z-index on .wrap so mix-blend-mode:screen blends directly with body & erases the black box */
.wrap{position:relative;max-width:900px;margin:0 auto;padding:48px 24px 36px;min-height:100vh;display:flex;flex-direction:column;align-items:center;text-align:center}

/* Logo with Black Box Removed + Natural Felt Santa Hat on 'M' */
.logo-wrap{position:relative;display:inline-block;margin-bottom:14px}
.logo{
  display:block;width:clamp(118px,13vw,156px);height:auto;
  mix-blend-mode:screen;
  filter:brightness(1.08) contrast(1.16);
}
.santa-hat{
  position:absolute;top:-4%;left:10%;width:24%;height:auto;
  transform-origin:bottom center;
  transform:rotate(-16deg);pointer-events:none;
  filter:drop-shadow(0 3px 5px rgba(0,0,0,.75));
}

main{position:relative;z-index:5;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%}
.rise{opacity:0;transform:translateY(16px);animation:rise .8s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes rise{to{opacity:1;transform:none}}
.chip{display:inline-flex;align-items:center;gap:10px;font-size:.9rem;color:var(--muted);padding:7px 16px;border-radius:999px;border:1px solid var(--line);background:rgba(12,17,30,.55);backdrop-filter:blur(8px);margin-bottom:24px}
.dot{width:8px;height:8px;border-radius:50%;background:#ff4d6d;box-shadow:0 0 0 0 rgba(255,77,109,.6);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 9px rgba(255,77,109,0)}100%{box-shadow:0 0 0 0 rgba(255,77,109,0)}}
h1{font-family:var(--display);font-weight:800;font-size:clamp(2.4rem,6.8vw,4.8rem);line-height:1.06;letter-spacing:-.015em;font-variant-ligatures:none;text-shadow:0 8px 30px rgba(0,0,0,.6)}
h1 span{display:block;color:var(--muted)}

/* Countdown Cards with Natural Frost & Snow Accumulation */
.clock{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:40px;width:100%;max-width:560px}
.unit{
  position:relative;padding:20px 8px 14px;border-radius:18px;
  background:rgba(15, 22, 38, .58);
  border:1px solid rgba(242,245,251,.16);
  backdrop-filter:blur(10px);
  box-shadow:0 12px 32px rgba(0,0,0,.35);
}
.unit::before{
  content:"";position:absolute;top:-2px;left:10%;right:10%;height:4px;
  border-radius:999px;
  background:linear-gradient(90deg, transparent, rgba(235,244,255,.88) 25%, rgba(255,255,255,.98) 50%, rgba(235,244,255,.88) 75%, transparent);
  filter:blur(.4px);
}
.unit b{display:block;font-family:var(--display);font-weight:600;font-size:clamp(2.2rem,6vw,3.6rem);line-height:1;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.unit span{display:block;margin-top:8px;color:var(--muted);font-size:.85rem}
.when{margin-top:22px;color:var(--muted);font-size:1rem}

.live{display:none}
.live p{font-family:var(--display);font-size:1.8rem;font-weight:600;margin-bottom:18px}
.btn{display:inline-block;padding:13px 26px;border-radius:12px;font-weight:500;color:var(--bg);text-decoration:none;background:var(--ink)}
body.launched .clock,body.launched .when,body.launched .chip,body.launched h1{display:none}
body.launched .live{display:block}

/* Footer clearly legible above the snow ground */
footer{
  position:relative;z-index:5;
  display:flex;flex-wrap:wrap;justify-content:center;gap:10px 26px;
  color:var(--muted);font-size:.92rem;
  padding:8px 18px;border-radius:999px;
  background:rgba(7, 10, 18, .62);
  backdrop-filter:blur(8px);
  border:1px solid rgba(242, 245, 251, .1);
}
footer a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line);transition:border-color .2s}
footer a:hover{border-color:var(--ink)}
a:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:4px}

@media (max-width:640px){
  .clock{gap:8px}
  .unit{padding:14px 4px 10px}
  .bulb:nth-child(even){display:none}
  .tree-left{width:118px;left:-10px}
  .tree-right{width:88px;right:-10px}
  footer{gap:8px 16px;font-size:.85rem;padding:7px 14px}
}
</style>

<noscript><p style="position:relative;z-index:5;text-align:center;padding:0 24px 24px;color:#8e9ab8">This page counts down to 1 January 2027, 12:00 am Sri Lanka time. Please enable JavaScript to see the timer.</p></noscript>

<script>
(function(){
  var LAUNCH = new Date('2027-01-01T00:00:00+05:30').getTime(); // Sri Lanka time
  var LIVE_URL = ''; // set to the new site path after launch; '' = reload this page
  var $ = function(id){return document.getElementById(id)};
  var pad = function(n){return String(n).padStart(2,'0')};
  var launched = false;

  /* Countdown Timer */
  function launch(){
    if(launched) return; launched = true;
    document.body.classList.add('launched');
    document.title = 'Maneesha Sathsara | AI Engineer Portfolio';
    if(LIVE_URL){ $('enter').href = LIVE_URL; location.replace(LIVE_URL); }
    else { $('enter').href = location.pathname; $('enter').textContent = 'Reload the site'; }
  }
  function tick(){
    var left = LAUNCH - Date.now();
    if(left<=0){ launch(); return; }
    var s = Math.floor(left/1000);
    $('d').textContent = pad(Math.floor(s/86400)); $('h').textContent = pad(Math.floor(s%86400/3600));
    $('m').textContent = pad(Math.floor(s%3600/60)); $('s').textContent = pad(s%60);
  }
  tick(); setInterval(tick, 1000);

  /* High-DPI Wind-Blown Snowfall + Synchronized Swaying Christmas Trees */
  var canvas = $('fx');
  var ctx = canvas.getContext('2d');
  var treeLeft = $('treeLeft');
  var treeRight = $('treeRight');
  var treeLeftTop = $('treeLeftTop');
  var treeRightTop = $('treeRightTop');
  var santaHat = $('santaHat');

  var flakes = [];
  var windStreaks = [];
  var w, h, dpr;

  function resize(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth;
    h = window.innerHeight;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  /* Multi-depth snowflakes + low-lying blowing snow spindrift */
  var totalFlakes = Math.min(145, Math.max(65, Math.floor(w / 8)));
  for(var i = 0; i < totalFlakes; i++){
    var depth = Math.random();
    flakes.push({
      x: Math.random() * w,
      y: Math.random() * h,
      r: 0.9 + depth * 2.5,
      speedY: 0.45 + depth * 1.25,
      windFactor: 0.55 + depth * 0.95,
      phase: Math.random() * Math.PI * 2,
      freq: 0.012 + Math.random() * 0.016,
      alpha: 0.25 + depth * 0.6,
      bokeh: depth > 0.8
    });
  }

  /* Subtle atmospheric wind mist streaks */
  var streakCount = Math.min(14, Math.max(6, Math.floor(w / 110)));
  for(var j = 0; j < streakCount; j++){
    windStreaks.push({
      x: Math.random() * w,
      y: Math.random() * h,
      len: 45 + Math.random() * 95,
      speed: 3.5 + Math.random() * 4.5,
      alpha: 0.03 + Math.random() * 0.05
    });
  }

  var lastTime = performance.now();

  function animate(now){
    var dt = Math.min(0.05, (now - lastTime) / 1000);
    lastTime = now;
    var t = now * 0.001;

    ctx.clearRect(0, 0, w, h);

    /* Realistic organic wind wave (gentle breeze + periodic stronger gusts) */
    var gust =
      1.35 +
      Math.sin(t * 0.55) * 0.85 +
      Math.sin(t * 1.35 + 1.2) * 0.45 +
      Math.sin(t * 2.6) * 0.18;
    // Always has a noticeable breeze, peaking during gusts
    var windSpeed = Math.max(0.45, gust);

    /* 1. Sway Christmas Trees & Santa Hat in Sync with the Wind */
    var baseSway = windSpeed * 2.4 + Math.sin(t * 2.2) * 0.65;
    var topSway = windSpeed * 1.6 + Math.cos(t * 2.8) * 0.7;

    if(treeLeft){
      treeLeft.style.transform = 'rotate(' + baseSway.toFixed(2) + 'deg) skewX(' + (baseSway * 0.35).toFixed(2) + 'deg)';
    }
    if(treeLeftTop){
      treeLeftTop.style.transform = 'rotate(' + topSway.toFixed(2) + 'deg)';
    }
    if(treeRight){
      var rightBase = baseSway * 0.92 + Math.sin(t * 2.5 + 0.8) * 0.55;
      treeRight.style.transform = 'rotate(' + rightBase.toFixed(2) + 'deg) skewX(' + (rightBase * 0.35).toFixed(2) + 'deg)';
    }
    if(treeRightTop){
      treeRightTop.style.transform = 'rotate(' + (topSway * 0.95).toFixed(2) + 'deg)';
    }
    if(santaHat){
      santaHat.style.transform = 'rotate(' + (-16 + windSpeed * 2.2).toFixed(1) + 'deg)';
    }

    /* 2. Draw Subtle Wind Mist Streaks During Gusts */
    var gustIntensity = Math.max(0, (windSpeed - 1.1) / 1.7);
    if(gustIntensity > 0.05){
      ctx.lineCap = 'round';
      for(var k = 0; k < windStreaks.length; k++){
        var st = windStreaks[k];
        var gradS = ctx.createLinearGradient(st.x, st.y, st.x + st.len, st.y + st.len * 0.14);
        gradS.addColorStop(0, 'rgba(226, 239, 255, 0)');
        gradS.addColorStop(0.5, 'rgba(226, 239, 255, ' + (st.alpha * gustIntensity).toFixed(3) + ')');
        gradS.addColorStop(1, 'rgba(226, 239, 255, 0)');

        ctx.strokeStyle = gradS;
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.moveTo(st.x, st.y);
        ctx.lineTo(st.x + st.len, st.y + st.len * 0.14);
        ctx.stroke();

        st.x += (st.speed + windSpeed * 2.8) * (dt * 60);
        st.y += (0.5 + windSpeed * 0.35) * (dt * 60);
        if(st.x > w + 120){ st.x = -st.len - 20; st.y = Math.random() * h; }
        if(st.y > h) st.y = 0;
      }
    }

    /* 3. Draw Wind-Blown Snowflakes */
    for(var i = 0; i < flakes.length; i++){
      var f = flakes[i];
      ctx.beginPath();
      if(f.bokeh){
        var grad = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r * 1.4);
        grad.addColorStop(0, 'rgba(242, 245, 251, ' + f.alpha + ')');
        grad.addColorStop(1, 'rgba(242, 245, 251, 0)');
        ctx.fillStyle = grad;
        ctx.arc(f.x, f.y, f.r * 1.4, 0, Math.PI * 2);
      } else {
        ctx.fillStyle = 'rgba(242, 245, 251, ' + f.alpha + ')';
        ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
      }
      ctx.fill();

      f.phase += f.freq;
      f.y += (f.speedY + Math.sin(f.phase) * 0.15) * (dt * 60);
      f.x += (windSpeed * f.windFactor * 1.35 + Math.sin(f.phase) * 0.55) * (dt * 60);

      if(f.y > h + 8){ f.y = -8; f.x = Math.random() * w; }
      if(f.x > w + 10) f.x = -10;
      if(f.x < -10) f.x = w + 10;
    }

    requestAnimationFrame(animate);
  }
  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
