<style>
:root{
  --bg:#070a12; --ink:#f2f5fb; --muted:rgba(242,245,251,.62); --line:rgba(242,245,251,.14);
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"DM Sans","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.6;min-height:100vh;overflow-x:hidden}

/* Natural Winter Night Sky Atmosphere */
body{
  background:
    radial-gradient(ellipse 80% 50% at 50% -10%, rgba(34, 58, 102, .34) 0%, transparent 70%),
    radial-gradient(ellipse 95% 28% at 50% 102%, rgba(190, 215, 255, .07) 0%, transparent 75%),
    #070a12;
}

/* Fullscreen Canvas for Multi-Depth Snowfall & Golden Stardust */
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:4}

/* Realistic Snow-Dusted Pine Trees at Bottom Corners */
.tree-left{position:fixed;bottom:-4px;left:1vw;width:clamp(155px, 21vw, 270px);pointer-events:none;z-index:2;filter:drop-shadow(0 12px 26px rgba(0,0,0,.8))}
.tree-right{position:fixed;bottom:-4px;right:1.5vw;width:clamp(110px, 14vw, 185px);pointer-events:none;z-index:2;filter:drop-shadow(0 12px 26px rgba(0,0,0,.8))}

/* ONLY the Christmas Tree Star twinkles/blinks */
.tree-star{
  transform-box:fill-box;
  transform-origin:center;
  animation:starTwinkle 1.8s infinite ease-in-out;
}
@keyframes starTwinkle{
  0%, 100%{opacity:1;transform:scale(1.18) rotate(0deg);filter:brightness(1.45)}
  45%{opacity:.92;transform:scale(1.04) rotate(3deg)}
  58%, 74%{opacity:.18;transform:scale(.8) rotate(-3deg);filter:brightness(.4)}
  88%{opacity:1;transform:scale(1.24) rotate(2deg);filter:brightness(1.6)}
}

/* Realistic Moonlit Santa Claus & 4-Reindeer Sleigh */
#santaSleigh{
  position:fixed;top:0;left:0;width:255px;pointer-events:none;z-index:3;
  will-change:transform;
  filter:drop-shadow(0 10px 22px rgba(0, 0, 0, .65));
}
.leg-f1{transform-origin:top center;animation:gallopA .34s infinite ease-in-out alternate}
.leg-b1{transform-origin:top center;animation:gallopB .34s infinite ease-in-out alternate}
.leg-f2{transform-origin:top center;animation:gallopB .34s infinite ease-in-out alternate}
.leg-b2{transform-origin:top center;animation:gallopA .34s infinite ease-in-out alternate}
.deer-stride{transform-origin:center;animation:strideBob .34s infinite ease-in-out alternate}
.lantern-glow{animation:lanternPulse 1.6s infinite ease-in-out alternate}

@keyframes gallopA{0%{transform:rotate(-28deg)}100%{transform:rotate(28deg)}}
@keyframes gallopB{0%{transform:rotate(28deg)}100%{transform:rotate(-28deg)}}
@keyframes strideBob{0%{transform:translateY(-1.4px) rotate(-1.8deg)}100%{transform:translateY(1.4px) rotate(1.8deg)}}
@keyframes lanternPulse{0%{opacity:.75;transform:scale(.94)}100%{opacity:1;transform:scale(1.08)}}

/* No z-index on .wrap so mix-blend-mode:screen blends directly with body & erases the black box */
.wrap{position:relative;max-width:900px;margin:0 auto;padding:44px 24px 32px;min-height:100vh;display:flex;flex-direction:column;align-items:center;text-align:center}

/* Logo with Black Box Removed + Natural Felt Santa Hat on 'M' */
.logo-wrap{position:relative;display:inline-block;margin-bottom:14px}
.logo{
  display:block;width:clamp(118px,13vw,156px);height:auto;
  mix-blend-mode:screen;
  filter:brightness(1.08) contrast(1.16);
}
.santa-hat{
  position:absolute;top:-4%;left:10%;width:24%;height:auto;
  transform:rotate(-16deg);pointer-events:none;
  filter:drop-shadow(0 3px 5px rgba(0,0,0,.75));
}

main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%}
.rise{opacity:0;transform:translateY(16px);animation:rise .8s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes rise{to{opacity:1;transform:none}}
.chip{display:inline-flex;align-items:center;gap:10px;font-size:.9rem;color:var(--muted);padding:7px 16px;border-radius:999px;border:1px solid var(--line);background:rgba(12,17,30,.55);backdrop-filter:blur(8px);margin-bottom:24px}
.dot{width:8px;height:8px;border-radius:50%;background:#ff4d6d;box-shadow:0 0 0 0 rgba(255,77,109,.6);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 9px rgba(255,77,109,0)}100%{box-shadow:0 0 0 0 rgba(255,77,109,0)}}
h1{font-family:var(--display);font-weight:800;font-size:clamp(2.4rem,6.8vw,4.8rem);line-height:1.06;letter-spacing:-.015em;font-variant-ligatures:none;text-shadow:0 8px 30px rgba(0,0,0,.6)}
h1 span{display:block;color:var(--muted)}

/* Countdown Cards with Natural Frost & Snow Accumulation */
.clock{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:40px;width:100%;max-width:560px}
.unit{
  position:relative;padding:20px 8px 14px;border-radius:18px;
  background:rgba(15, 22, 38, .55);
  border:1px solid rgba(242,245,251,.15);
  backdrop-filter:blur(10px);
  box-shadow:0 12px 32px rgba(0,0,0,.35);
}
.unit::before{
  content:"";position:absolute;top:-2px;left:10%;right:10%;height:4px;
  border-radius:999px;
  background:linear-gradient(90deg, transparent, rgba(235,244,255,.85) 25%, rgba(255,255,255,.95) 50%, rgba(235,244,255,.85) 75%, transparent);
  filter:blur(.4px);
}
.unit b{display:block;font-family:var(--display);font-weight:600;font-size:clamp(2.2rem,6vw,3.6rem);line-height:1;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.unit span{display:block;margin-top:8px;color:var(--muted);font-size:.85rem}
.when{margin-top:22px;color:var(--muted);font-size:1rem}

.live{display:none}
.live p{font-family:var(--display);font-size:1.8rem;font-weight:600;margin-bottom:18px}
.btn{display:inline-block;padding:13px 26px;border-radius:12px;font-weight:500;color:var(--bg);text-decoration:none;background:var(--ink)}
body.launched .clock,body.launched .when,body.launched .chip,body.launched h1{display:none}
body.launched .live{display:block}
footer{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 28px;color:var(--muted);font-size:.95rem;padding-top:14px}
footer a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line);transition:border-color .2s}
footer a:hover{border-color:var(--ink)}
a:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:4px}

@media (max-width:640px){
  .clock{gap:8px}
  .unit{padding:14px 4px 10px}
  .tree-left{width:118px;left:-8px;opacity:.92}
  .tree-right{width:88px;right:-8px;opacity:.88}
  #santaSleigh{width:165px}
}
</style>

<noscript><p style="position:relative;text-align:center;padding:0 24px 24px;color:#8e9ab8">This page counts down to 1 January 2027, 12:00 am Sri Lanka time. Please enable JavaScript to see the timer.</p></noscript>

<script>
(function(){
  var LAUNCH = new Date('2027-01-01T00:00:00+05:30').getTime(); // Sri Lanka time
  var LIVE_URL = ''; // set to the new site path after launch; '' = reload this page
  var $ = function(id){return document.getElementById(id)};
  var pad = function(n){return String(n).padStart(2,'0')};
  var launched = false;

  /* Countdown Timer */
  function launch(){
    if(launched) return; launched = true;
    document.body.classList.add('launched');
    document.title = 'Maneesha Sathsara | AI Engineer Portfolio';
    if(LIVE_URL){ $('enter').href = LIVE_URL; location.replace(LIVE_URL); }
    else { $('enter').href = location.pathname; $('enter').textContent = 'Reload the site'; }
  }
  function tick(){
    var left = LAUNCH - Date.now();
    if(left<=0){ launch(); return; }
    var s = Math.floor(left/1000);
    $('d').textContent = pad(Math.floor(s/86400)); $('h').textContent = pad(Math.floor(s%86400/3600));
    $('m').textContent = pad(Math.floor(s%3600/60)); $('s').textContent = pad(s%60);
  }
  tick(); setInterval(tick, 1000);

  /* High-DPI Multi-Layer Snow + Natural Sweeping Sky Flight for Santa */
  var canvas = $('fx');
  var ctx = canvas.getContext('2d');
  var santaEl = $('santaSleigh');
  var flakes = [];
  var stardust = [];
  var w, h, dpr;

  function resize(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth;
    h = window.innerHeight;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  /* 3 Depth Layers of Snowflakes (Works on All Mobile & Desktop Devices) */
  var totalFlakes = Math.min(125, Math.max(55, Math.floor(w / 9)));
  for(var i = 0; i < totalFlakes; i++){
    var depth = Math.random();
    flakes.push({
      x: Math.random() * w,
      y: Math.random() * h,
      r: 0.9 + depth * 2.6,
      speedY: 0.35 + depth * 1.15,
      windAmp: 0.25 + depth * 0.65,
      phase: Math.random() * Math.PI * 2,
      freq: 0.009 + Math.random() * 0.014,
      alpha: 0.22 + depth * 0.58,
      bokeh: depth > 0.78
    });
  }

  /* Natural Sweeping Flight Path Around the Site (No Squishing or Vertical Nose-Dives) */
  var theta = -Math.PI * 0.5;
  var lastTime = performance.now();
  var frameCount = 0;

  function animate(now){
    var dt = Math.min(0.05, (now - lastTime) / 1000);
    lastTime = now;
    ctx.clearRect(0, 0, w, h);
    frameCount++;

    /* 1. Santa Sleigh Flying in Graceful Sweeping Arcs Around the Site */
    if(santaEl){
      // 1 full cycle every ~18 seconds
      theta += dt * ((Math.PI * 2) / 18);

      var sw = santaEl.offsetWidth || 220;
      var sh = santaEl.offsetHeight || 65;

      // Sweeps wide across the top sky, curves gracefully down the sides, and sweeps back across the lower sky
      var rx = (w * 0.5) + (sw * 0.35);
      var ry = h * 0.38;
      var cx = w * 0.5;
      var cy = h * 0.49;

      var px = cx + rx * Math.sin(theta);
      var py = cy - ry * Math.cos(theta) + Math.sin(theta * 2) * 18;

      var vx = rx * Math.cos(theta);
      var vy = ry * Math.sin(theta) + Math.cos(theta * 2) * 36;

      var dir = vx >= 0 ? 1 : -1;
      // Gentle aerodynamic pitch (-14 deg to +14 deg) so reindeer always fly naturally
      var pitchDeg = Math.max(-14, Math.min(14, Math.atan2(vy, Math.abs(vx) + w * 0.35) * (180 / Math.PI)));

      santaEl.style.transform =
        'translate3d(' + (px - sw * 0.5).toFixed(1) + 'px,' + (py - sh * 0.5).toFixed(1) + 'px,0) ' +
        'scaleX(' + dir + ') ' +
        'rotate(' + pitchDeg.toFixed(1) + 'deg)';

      // Emit subtle golden stardust from sleigh runners while visible on screen
      if(frameCount % 2 === 0 && px > -60 && px < w + 60){
        var tailX = px - dir * (sw * 0.38);
        var tailY = py + sh * 0.2;
        stardust.push({
          x: tailX + (Math.random() - 0.5) * 6,
          y: tailY + (Math.random() - 0.5) * 5,
          vx: -dir * 0.4 + (Math.random() - 0.5) * 0.25,
          vy: 0.25 + Math.random() * 0.35,
          r: Math.random() * 1.8 + 0.8,
          life: 1
        });
      }
    }

    /* 2. Render Golden Stardust Trail */
    for(var s = stardust.length - 1; s >= 0; s--){
      var pt = stardust[s];
      ctx.save();
      ctx.globalAlpha = pt.life * 0.78;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.r, 0, Math.PI * 2);
      ctx.fillStyle = pt.life > 0.5 ? '#fef08a' : '#f59e0b';
      ctx.fill();
      ctx.restore();

      pt.x += pt.vx;
      pt.y += pt.vy;
      pt.life -= 0.018;
      if(pt.life <= 0) stardust.splice(s, 1);
    }

    /* 3. Render Multi-Depth Snowfall */
    for(var i = 0; i < flakes.length; i++){
      var f = flakes[i];
      ctx.beginPath();
      if(f.bokeh){
        var grad = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r * 1.4);
        grad.addColorStop(0, 'rgba(242, 245, 251, ' + f.alpha + ')');
        grad.addColorStop(1, 'rgba(242, 245, 251, 0)');
        ctx.fillStyle = grad;
        ctx.arc(f.x, f.y, f.r * 1.4, 0, Math.PI * 2);
      } else {
        ctx.fillStyle = 'rgba(242, 245, 251, ' + f.alpha + ')';
        ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
      }
      ctx.fill();

      f.y += f.speedY;
      f.phase += f.freq;
      f.x += Math.sin(f.phase) * f.windAmp;

      if(f.y > h + 8){ f.y = -8; f.x = Math.random() * w; }
      if(f.x > w + 8) f.x = -8;
      if(f.x < -8) f.x = w + 8;
    }

    requestAnimationFrame(animate);
  }
  requestAnimationFrame(animate);
})();
</script>
